name: Publicar jogo no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js para verificacao
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias de desenvolvimento
        run: npm ci

      - name: Verificar JavaScript
        run: npm run check

      - name: Atualizar home e ajuda
        run: npm run build

      - name: Executar testes
        run: npm test

      - name: Empacotar somente o jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
